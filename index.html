
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VARIANT BLAZER - 3D ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050914;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;background:rgba(5,15,30,.78);border:1px solid #3e729b;padding:10px 13px;border-radius:6px}
#playerPanel{left:14px;top:14px;width:245px}
#enemyPanel{right:14px;top:14px;width:245px;text-align:right}
.name{font-weight:bold;letter-spacing:1px;font-size:15px;margin-bottom:8px}
.bar{height:12px;background:#252c3b;border:1px solid #62748b;margin:5px 0 9px;overflow:hidden}
.fill{height:100%;width:100%;transition:width .12s}
#hpFill{background:linear-gradient(90deg,#00b9ff,#65f5ff)}
#enemyFill{background:linear-gradient(90deg,#ffab36,#ff384e)}
#boostFill{background:linear-gradient(90deg,#267aff,#4feaff)}
#burstFill{background:linear-gradient(90deg,#b65aff,#ff72df)}
#lock{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid #ff5252;border-radius:50%;opacity:.8}
#lock:before,#lock:after{content:"";position:absolute;background:#ff5252}
#lock:before{width:76px;height:1px;left:-13px;top:25px}
#lock:after{height:76px;width:1px;left:25px;top:-13px}
#lockLabel{position:absolute;left:50%;top:calc(50% + 39px);transform:translateX(-50%);font-size:11px;color:#ff6868;text-shadow:0 0 6px #000}
#message{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#fff;text-shadow:0 0 12px #00bfff;text-align:center}
#help{position:absolute;left:14px;bottom:12px;font-size:12px;line-height:1.65;color:#d8e8ff;background:rgba(3,10,20,.72);padding:10px 13px;border-radius:5px}
#status{position:absolute;right:14px;bottom:14px;text-align:right;font-size:13px;color:#a7dfff;text-shadow:0 1px 4px #000}
#restart{pointer-events:auto;border:1px solid #68caff;color:white;background:#102945;padding:7px 12px;margin-top:7px;cursor:pointer}
#mobile{display:none;position:absolute;bottom:12px;right:12px;pointer-events:auto;gap:5px;flex-wrap:wrap;width:210px;justify-content:flex-end}
#mobile button{width:62px;height:46px;background:#12304ddd;border:1px solid #73bfff;color:white;border-radius:8px;font-size:12px;touch-action:none}
@media(max-width:700px){#help{font-size:10px;max-width:55%;}#playerPanel,#enemyPanel{width:39%;padding:7px;font-size:11px}.name{font-size:11px}#mobile{display:flex}#message{font-size:19px}}
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="playerPanel">
    <div class="name">VARIANT BLAZER</div>
    <div>ARMOR <span id="hpText">1000</span></div>
    <div class="bar"><div class="fill" id="hpFill"></div></div>
    <div>BOOST</div>
    <div class="bar"><div class="fill" id="boostFill"></div></div>
    <div>BURST</div>
    <div class="bar"><div class="fill" id="burstFill"></div></div>
  </div>
  <div class="panel" id="enemyPanel">
    <div class="name">OBSIDIAN RAIDER</div>
    <div>ARMOR <span id="enemyHpText">1000</span></div>
    <div class="bar"><div class="fill" id="enemyFill"></div></div>
    <div id="enemyState">COMBAT READY</div>
  </div>
  <div id="lock"></div>
  <div id="lockLabel">LOCK ON</div>
  <div id="message">SYSTEM ONLINE</div>
  <div id="help">
    WASD：移動　J：射撃　K：格闘<br>
    J+K：拘束投げ　J+L：ブーメラン<br>
    L：ジャンプ　Lを2回：ブーストダッシュ<br>
    同じ移動キーを2回：ステップ<br>
    K+L：高速特殊移動　S→W：ガード<br>
    J+K+L：覚醒 / 覚醒中はバースト攻撃<br>
    <span style="color:#83e8ff">敵を倒すと勝利。ブーストは着地中に回復。</span>
  </div>
  <div id="status">MODE: CPU BATTLE<br>LOCK: ACTIVE<br><button id="restart">RESTART</button></div>
  <div id="mobile">
    <button data-key="w">前進</button><button data-key="j">射撃</button><button data-key="k">格闘</button>
    <button data-key="a">左</button><button data-key="s">後退</button><button data-key="d">右</button>
    <button data-key="l">ジャンプ</button><button data-key="jk">拘束</button><button data-key="jl">特殊射撃</button>
    <button data-key="kl">特殊移動</button><button data-key="burst">覚醒</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07101e);
scene.fog = new THREE.Fog(0x07101e, 35, 100);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 250);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9ccfff,0x182033,2.0));
const sun = new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(12,24,10);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(180,180),
  new THREE.MeshStandardMaterial({color:0x172333,roughness:.88,metalness:.2})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid = new THREE.GridHelper(180,90,0x315879,0x20374d);
grid.position.y=.015;
scene.add(grid);

for(let i=0;i<32;i++){
  const a=i*Math.PI*2/32;
  const pillar=new THREE.Mesh(
    new THREE.BoxGeometry(.5,2+Math.random()*7,.5),
    new THREE.MeshStandardMaterial({color:0x1d3449,emissive:0x071321})
  );
  pillar.position.set(Math.cos(a)*42, pillar.geometry.parameters.height/2,Math.sin(a)*42);
  scene.add(pillar);
}

function material(color,emissive=0x000000,metalness=.5){
 return new THREE.MeshStandardMaterial({color,emissive,metalness,roughness:.36});
}

function makeRobot(mainColor,glowColor){
 const root=new THREE.Group();
 const bodyMat=material(mainColor,0x07111d,.72);
 const dark=material(0x182434,0x000000,.8);
 const glow=material(glowColor,glowColor,.3);
 const addBox=(parent,mat,x,y,z,sx,sy,sz)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
  parent.add(m);return m;
 };
 const torso=new THREE.Group();
 root.add(torso);
 addBox(torso,bodyMat,0,1.75,0,.85,.9,.48);
 addBox(torso,glow,0,1.83,.255,.23,.23,.035);
 addBox(torso,bodyMat,0,2.29,0,.43,.25,.4);
 addBox(torso,dark,0,2.48,.015,.24,.14,.24);
 addBox(torso,glow,0,2.48,.15,.12,.035,.035);
 for(const side of [-1,1]){
  addBox(torso,bodyMat,side*.49,2.25,0,.19,.13,.24);
  addBox(torso,glow,side*.49,2.26,.13,.12,.045,.04);
  const arm=new THREE.Group();arm.position.set(side*.55,1.98,0);torso.add(arm);
  addBox(arm,bodyMat,0,-.27,0,.24,.52,.27);
  addBox(arm,dark,0,-.58,.02,.22,.15,.23);
  const leg=new THREE.Group();leg.position.set(side*.23,1.32,0);root.add(leg);
  addBox(leg,bodyMat,0,-.35,0,.3,.72,.35);
  addBox(leg,dark,0,-.72,.08,.31,.18,.48);
  addBox(leg,glow,0,-.25,.185,.11,.2,.025);
  if(side===1)root.userData.rightArm=arm;
 }
 const backpack=addBox(root,dark,0,1.8,-.37,.7,.8,.3);
 for(const side of [-1,1]){
  const wing=addBox(root,glow,side*.55,1.95,-.45,.12,.85,.18);
  wing.rotation.z=side*.28;
 }
 root.userData.torso=torso;
 root.userData.bodyMat=bodyMat;
 root.userData.glow=glow;
 root.userData.legs=[];
 root.userData.arms=[];
 root.position.y=0;
 scene.add(root);
 return root;
}

const player=makeRobot(0x225b99,0x00cfff);
player.position.set(-5,0,0);
const enemy=makeRobot(0x6b2839,0xff3e5e);
enemy.position.set(5,0,0);

const state={
 hp:1000, enemyHp:1000, boost:100, burst:0,
 burstTime:0, invuln:0, stun:0, enemyStun:0,
 jump:0, grounded:true, dash:0, step:0, special:0,
 attackCooldown:0, combo:0, comboTimer:0,
 enemyAttack:0, enemyFire:0, enemyCombo:0,
 guard:0, dead:false, enemyDead:false,
 messageTime:2, lastDir:{x:0,z:1}, burstAttackCooldown:0
};

const keys=new Set();
const lastTap={};
const projectiles=[];
const boomerangs=[];
const effects=[];
const clock=new THREE.Clock();
const tempVec=new THREE.Vector3();
const cameraTarget=new THREE.Vector3();
const cameraPos=new THREE.Vector3();

function setMessage(text,time=1.2){
 $("message").textContent=text;
 state.messageTime=time;
}

function direction(){
 const v=new THREE.Vector3();
 if(keys.has("w"))v.z-=1;
 if(keys.has("s"))v.z+=1;
 if(keys.has("a"))v.x-=1;
 if(keys.has("d"))v.x+=1;
 if(v.lengthSq()>0)v.normalize();
 return v;
}

function faceTarget(obj,target){
 const dx=target.position.x-obj.position.x;
 const dz=target.position.z-obj.position.z;
 obj.rotation.y=Math.atan2(dx,dz);
}

function spawnEffect(pos,color=0x50dfff,scale=1){
 const mesh=new THREE.Mesh(
  new THREE.TorusGeometry(.4*scale,.045*scale,8,24),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95})
 );
 mesh.position.copy(pos);mesh.rotation.x=Math.PI/2;
 scene.add(mesh);
 effects.push({mesh,life:.35,max:.35});
}

function projectile(from,to,damage=35,speed=24,color=0x39ddff,owner="player"){
 const start=from.clone();
 start.y+=1.8;
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(.13,10,8),
  new THREE.MeshBasicMaterial({color})
 );
 mesh.position.copy(start);
 scene.add(mesh);
 const trail=new THREE.PointLight(color,1.2,3);
 mesh.add(trail);
 const dir=to.clone().sub(start).normalize();
 projectiles.push({mesh,dir,speed,damage,life:3,owner});
}

function hitEnemy(damage,knock=1.5){
 if(state.enemyDead||state.enemyStun>0)return;
 state.enemyHp=Math.max(0,state.enemyHp-damage);
 state.enemyStun=.25;
 const dir=enemy.position.clone().sub(player.position).setY(0).normalize();
 enemy.position.addScaledVector(dir,knock);
 spawnEffect(enemy.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff5878,1.1);
 if(state.enemyHp<=0){
  state.enemyDead=true;
  setMessage("MISSION COMPLETE",10);
  spawnEffect(enemy.position.clone().add(new THREE.Vector3(0,2,0)),0xffc45c,3);
 }
}

function hitPlayer(damage,knock=1.2){
 if(state.dead||state.invuln>0||state.guard>0)return;
 const actual=state.burst>0?damage*1.5:damage;
 state.hp=Math.max(0,state.hp-actual);
 state.stun=.35;
 state.invuln=.3;
 const dir=player.position.clone().sub(enemy.position).setY(0).normalize();
 player.position.addScaledVector(dir,knock);
 spawnEffect(player.position.clone().add(new THREE.Vector3(0,1.5,0)),0xffb04c,1);
 if(state.burst>0)endBurst();
 if(state.hp<=0){
  state.dead=true;
  setMessage("MISSION FAILED",10);
 }
}

function shoot(){
 if(state.attackCooldown>0||state.dead)return;
 state.attackCooldown=.22;
 faceTarget(player,enemy);
 projectile(player.position,enemy.position,34,30,0x42e9ff,"player");
 spawnEffect(player.position.clone().add(new THREE.Vector3(0,1.8,0)),0x38ddff,.45);
}

function melee(){
 if(state.attackCooldown>0||state.dead||state.boost<4)return;
 state.attackCooldown=.35;
 state.boost-=4;
 faceTarget(player,enemy);
 const distance=player.position.distanceTo(enemy.position);
 state.combo=state.comboTimer>0?(state.combo%3)+1:1;
 state.comboTimer=.85;
 const dmg=[55,65,105][state.combo-1]*(state.burst>0?1.3:1);
 setMessage("MELEE COMBO  "+state.combo+"/3",.45);
 if(distance<4.2&&!state.enemyDead){
  hitEnemy(dmg, state.combo===3?3:1.2);
 }
 player.userData.torso.rotation.x=-.12;
 setTimeout(()=>{player.userData.torso.rotation.x=0},120);
}

function grabThrow(){
 if(state.attackCooldown>0||state.dead||state.boost<12)return;
 state.attackCooldown=1.1;
 state.boost-=12;
 faceTarget(player,enemy);
 if(player.position.distanceTo(enemy.position)<4.5&&!state.enemyDead){
  state.enemyStun=1;
  setMessage("GRAB → THROW",.9);
  const dir=enemy.position.clone().sub(player.position).setY(0).normalize();
  enemy.position.addScaledVector(dir,3.6);
  hitEnemy(95,2.5);
 }else setMessage("GRAB MISSED",.6);
}

function launchBoomerangs(){
 if(state.attackCooldown>0||state.dead||state.boost<8)return;
 state.attackCooldown=.7;
 state.boost-=8;
 faceTarget(player,enemy);
 setMessage("DUAL RETURNING DISCS",.7);
 for(const side of [-1,1]){
  const mesh=new THREE.Mesh(
   new THREE.TorusGeometry(.48,.075,8,24),
   new THREE.MeshStandardMaterial({color:0x48eaff,emissive:0x087aab,metalness:.6})
  );
  mesh.position.copy(player.position).add(new THREE.Vector3(side*.55,1.8,0));
  scene.add(mesh);
  boomerangs.push({
   mesh,side,t:0,phase:0,origin:player.position.clone(),
   damage:42,hit:false,owner:"player"
  });
 }
}

function specialMove(){
 if(state.attackCooldown>0||state.dead||state.boost<10)return;
 state.attackCooldown=.38;
 state.boost-=10;
 const d=direction();
 if(d.lengthSq()===0)d.copy(player.position).sub(enemy.position).setY(0).normalize();
 player.position.addScaledVector(d,7);
 state.invuln=.22;
 state.special=.35;
 spawnEffect(player.position.clone().add(new THREE.Vector3(0,1,0)),0x7b6aff,1.4);
 setMessage("PHASE SHIFT",.5);
}

function stepMove(d){
 if(state.boost<8||d.lengthSq()===0)return;
 state.boost-=8;
 player.position.addScaledVector(d,3.5);
 state.invuln=.3;
 state.step=.2;
 spawnEffect(player.position.clone().add(new THREE.Vector3(0,1,0)),0x55dfff,.8);
}

function boostDash(){
 if(state.boost<10||state.dead)return;
 state.boost-=10;
 state.dash=.42;
 state.invuln=.12;
 setMessage("BOOST DASH",.4);
}

function beginBurst(){
 if(state.burst>0){
  burstAttack();
  return;
 }
 if(state.burst<0||state.boost<5||state.dead)return;
 state.burst=100;
 state.burstTime=8;
 state.boost=Math.min(100,state.boost+50);
 player.userData.glow.emissive.setHex(0x4d00ff);
 setMessage("EX BURST ACTIVATED",1.3);
 spawnEffect(player.position.clone().add(new THREE.Vector3(0,1.5,0)),0xb95cff,2.3);
}

function burstAttack(){
 if(state.burstAttackCooldown>0||state.dead)return;
 state.burstAttackCooldown=1.4;
 faceTarget(player,enemy);
 const distance=player.position.distanceTo(enemy.position);
 if(distance<8){
  hitEnemy(190,5);
  spawnEffect(enemy.position.clone().add(new THREE.Vector3(0,1.8,0)),0xd88aff,2.3);
  setMessage("BURST ATTACK!",1);
 }else{
  setMessage("BURST ATTACK MISSED",.6);
 }
}

function endBurst(){
 state.burst=0;
 state.burstTime=0;
 player.userData.glow.emissive.setHex(0x00cfff);
 setMessage("BURST ENDED",.6);
}

function jump(){
 if(state.dead||state.boost<5||!state.grounded)return;
 state.grounded=false;
 state.jump=5.5;
 state.boost-=5;
}

function guard(){
 if(state.dead||state.boost<2)return;
 state.guard=.5;
 state.boost-=2;
 faceTarget(player,enemy);
 setMessage("GUARD",.4);
}

function triggerAction(key){
 const now=performance.now();
 if(["w","a","s","d"].includes(key)){
  if(lastTap[key]&&now-lastTap[key]<260){
   const d=new THREE.Vector3(
    key==="a"?-1:key==="d"?1:0,
    0,
    key==="w"?-1:key==="s"?1:0
   );
   stepMove(d);
   lastTap[key]=0;
  }else lastTap[key]=now;
  return;
 }
 if(key==="j")shoot();
 if(key==="k")melee();
 if(key==="l"){
  if(lastTap.l&&now-lastTap.l<300){
   boostDash();lastTap.l=0;
  }else{
   lastTap.l=now;
   jump();
  }
 }
}

function onKeyDown(e){
 const key=e.key.toLowerCase();
 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(key))e.preventDefault();
 if(keys.has(key))return;
 keys.add(key);

 if(key==="j"||key==="k"||key==="l"){
  if(keys.has("j")&&keys.has("k")&&keys.has("l")){
   beginBurst();return;
  }
  if(keys.has("j")&&keys.has("k")){grabThrow();return;}
  if(keys.has("j")&&keys.has("l")){launchBoomerangs();return;}
  if(keys.has("k")&&keys.has("l")){specialMove();return;}
  triggerAction(key);
 }
 if(key==="w"||key==="a"||key==="s"||key==="d")triggerAction(key);
}

function onKeyUp(e){
 const key=e.key.toLowerCase();
 keys.delete(key);
 if(key==="s")state.lastBack=performance.now();
 if(key==="w"&&state.lastBack&&performance.now()-state.lastBack<350)guard();
}

addEventListener("keydown",onKeyDown);
addEventListener("keyup",onKeyUp);
addEventListener("blur",()=>keys.clear());

document.querySelectorAll("#mobile button").forEach(btn=>{
 const key=btn.dataset.key;
 const down=e=>{
  e.preventDefault();
  if(key==="jk"){grabThrow();return;}
  if(key==="jl"){launchBoomerangs();return;}
  if(key==="kl"){specialMove();return;}
  if(key==="burst"){beginBurst();return;}
  if(key==="j"){shoot();return;}
  if(key==="k"){melee();return;}
  if(key==="l"){jump();return;}
  keys.add(key);
 };
 const up=e=>{e.preventDefault();keys.delete(key)};
 btn.addEventListener("pointerdown",down);
 btn.addEventListener("pointerup",up);
 btn.addEventListener("pointercancel",up);
 btn.addEventListener("pointerleave",up);
});

$("restart").addEventListener("click",()=>{
 location.reload();
});

function updatePlayer(dt){
 if(state.dead)return;
 const d=direction();
 const speed=state.burst>0?10.5:7;
 if(state.dash>0){
  let dashDir=d.clone();
  if(dashDir.lengthSq()===0)dashDir.copy(player.position).sub(enemy.position).setY(0).normalize();
  player.position.addScaledVector(dashDir,speed*1.65*dt);
  state.dash-=dt;
 }else if(state.special>0){
  state.special-=dt;
 }else if(state.step>0){
  state.step-=dt;
 }else{
  player.position.x+=d.x*speed*dt;
  player.position.z+=d.z*speed*dt;
 }
 if(d.lengthSq()>0)state.lastDir.copy(d);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-35,35);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-35,35);

 if(!state.grounded){
  player.position.y+=state.jump*dt;
  state.jump-=12*dt;
  if(player.position.y<=0){
   player.position.y=0;state.grounded=true;state.jump=0;
   state.boost=Math.min(100,state.boost+28);
  }
 }else if(keys.has("l")&&state.boost>0){
  state.grounded=false;state.jump=4.2;
 }

 if(state.grounded&&state.dash<=0&&state.special<=0){
  state.boost=Math.min(100,state.boost+13*dt);
 }
 if(state.attackCooldown>0)state.attackCooldown-=dt;
 if(state.comboTimer>0)state.comboTimer-=dt;
 if(state.invuln>0)state.invuln-=dt;
 if(state.stun>0)state.stun-=dt;
 if(state.guard>0)state.guard-=dt;
 if(state.burstAttackCooldown>0)state.burstAttackCooldown-=dt;
 if(state.burst>0){
  state.burstTime-=dt;
  state.burst=Math.max(0,state.burst-100/8*dt);
  if(state.burstTime<=0||state.burst<=0)endBurst();
 }
 faceTarget(player,enemy);
 player.userData.torso.position.y=1.75+Math.sin(performance.now()*.005)*.035;
}

function updateEnemy(dt){
 if(state.enemyDead)return;
 if(state.enemyStun>0){state.enemyStun-=dt;return;}
 const toPlayer=player.position.clone().sub(enemy.position);
 const dist=toPlayer.length();
 const dir=toPlayer.clone().setY(0).normalize();
 faceTarget(enemy,player);

 if(dist>7){
  enemy.position.addScaledVector(dir,3.8*dt);
 }else if(dist<4){
  enemy.position.addScaledVector(dir,-2.4*dt);
 }
 if(state.enemyFire>0)state.enemyFire-=dt;
 if(state.enemyAttack>0)state.enemyAttack-=dt;
 if(dist<16&&state.enemyFire<=0){
  state.enemyFire=1.4+Math.random()*.7;
  projectile(enemy.position,player.position,35,17,0xff4e66,"enemy");
 }
 if(dist<3.3&&state.enemyAttack<=0){
  state.enemyAttack=1.15;
  setTimeout(()=>{
   if(!state.dead&&!state.enemyDead&&player.position.distanceTo(enemy.position)<4){
    hitPlayer(65,1.6);
   }
  },220);
 }
}

function updateProjectiles(dt){
 for(let i=projectiles.length-1;i>=0;i--){
  const p=projectiles[i];
  p.life-=dt;
  if(p.life<=0){
   scene.remove(p.mesh);projectiles.splice(i,1);continue;
  }
  // Enemy shots make a small correction toward the player's current position.
  if(p.owner==="enemy"){
   const aim=player.position.clone().add(new THREE.Vector3(0,1.3,0));
   const wanted=aim.sub(p.mesh.position).normalize();
   p.dir.lerp(wanted,.7*dt).normalize();
  }
  p.mesh.position.addScaledVector(p.dir,p.speed*dt);
  if(p.owner==="player"&&!state.enemyDead&&p.mesh.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0,1.3,0)))<1.1){
   hitEnemy(p.damage,1);
   p.life=0;
  }else if(p.owner==="enemy"&&!state.dead&&p.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1.3,0)))<1.0){
   hitPlayer(p.damage,1);
   p.life=0;
  }
 }
}

function updateBoomerangs(dt){
 for(let i=boomerangs.length-1;i>=0;i--){
  const b=boomerangs[i];
  b.t+=dt;
  b.mesh.rotation.z+=dt*12;
  const center=player.position.clone().add(new THREE.Vector3(0,1.8,0));
  if(b.phase===0){
   const t=Math.min(1,b.t/0.65);
   const forward=player.position.clone().sub(enemy.position).setY(0).normalize().negate();
   const side=new THREE.Vector3(forward.z,0,-forward.x).multiplyScalar(b.side);
   b.mesh.position.copy(center)
    .addScaledVector(forward, t*8)
    .addScaledVector(side,Math.sin(t*Math.PI)*2.5);
   if(!b.hit&&b.mesh.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0,1.3,0)))<1.5){
    hitEnemy(b.damage,1.2);b.hit=true;
   }
   if(t>=1){b.phase=1;b.t=0;}
  }else if(b.phase===1){
   const t=Math.min(1,b.t/.65);
   const forward=player.position.clone().sub(enemy.position).setY(0).normalize().negate();
   const side=new THREE.Vector3(forward.z,0,-forward.x).multiplyScalar(b.side);
   b.mesh.position.copy(center)
    .addScaledVector(forward,8*(1-t))
    .addScaledVector(side,Math.sin((1-t)*Math.PI)*2.5);
   if(t>=1){scene.remove(b.mesh);boomerangs.splice(i,1);}
  }
 }
}

function updateEffects(dt){
 for(let i=effects.length-1;i>=0;i--){
  const e=effects[i];
  e.life-=dt;
  const t=1-Math.max(0,e.life)/e.max;
  e.mesh.scale.setScalar(1+t*2);
  e.mesh.material.opacity=Math.max(0,e.life/e.max);
  if(e.life<=0){scene.remove(e.mesh);e.mesh.geometry.dispose();e.mesh.material.dispose();effects.splice(i,1);}
 }
}

function updateCamera(dt){
 const forward=player.position.clone().sub(enemy.position).setY(0).normalize();
 const target=player.position.clone().add(new THREE.Vector3(0,1.5,0));
 const desired=player.position.clone()
  .addScaledVector(forward,-10)
  .add(new THREE.Vector3(0,6.2,0));
 camera.position.lerp(desired,1-Math.exp(-4*dt));
 cameraTarget.copy(target).lerp(enemy.position.clone().add(new THREE.Vector3(0,1.4,0)),.35);
 camera.lookAt(cameraTarget);
}

function updateHud(){
 $("hpText").textContent=Math.ceil(state.hp);
 $("enemyHpText").textContent=Math.ceil(state.enemyHp);
 $("hpFill").style.width=state.hp/10+"%";
 $("enemyFill").style.width=state.enemyHp/10+"%";
 $("boostFill").style.width=state.boost+"%";
 $("burstFill").style.width=state.burst+"%";
 $("enemyState").textContent=state.enemyDead?"DESTROYED":state.enemyStun>0?"STAGGER":"COMBAT READY";
 $("lock").style.opacity=state.enemyDead?".15":".8";
 $("lockLabel").textContent=state.enemyDead?"NO TARGET":"LOCK ON";
 $("status").innerHTML=
  "MODE: CPU BATTLE<br>RANGE: "+player.position.distanceTo(enemy.position).toFixed(1)+
  "<br>"+(state.burst>0?"EX BURST ACTIVE":state.guard>0?"GUARDING":"LOCK: ACTIVE")+
  '<br><button id="restart">RESTART</button>';
 $("restart").onclick=()=>location.reload();
 if(state.messageTime>0)state.messageTime-=clock.getDelta()*0;
 else if(!state.dead&&!state.enemyDead)$("message").textContent="";
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 updatePlayer(dt);
 updateEnemy(dt);
 updateProjectiles(dt);
 updateBoomerangs(dt);
 updateEffects(dt);
 updateCamera(dt);
 updateHud();
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
