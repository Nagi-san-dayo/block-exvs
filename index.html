<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VS ARENA</title>
<style>

canvas{display:block}

<div id="hud"><div id="tl"></div><div id="tr"></div><div id="bl"></div><div id="lk"><span></span></div><div id="dmg"></div><div id="msg"></div>
<div id="help">WASD:移動　L:ジャンプ(長押し上昇)／2回:ブーストダッシュ<br>J:メイン射撃　K:メイン格闘(連打で連撃)　JK:サブ格　JL:サブ射　KL:変形<br>方向キー2回:ステップ　S→W:ガード　Tab:ターゲット切替</div></div>
<div id="menu"><h1>機体を選択</h1></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,R=Math.random,C=(a,b,x)=>Math.max(a,Math.min(b,x)),$=i=>document.getElementById(i),V=(x,y,z)=>new T.Vector3(x,y,z),Y=V(0,1,0),msg=s=>$('msg').innerHTML=s;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(65,1,.1,600),ren=new T.WebGLRenderer({antialias:true});
sc.background=new T.Color(0x16233f);sc.fog=new T.Fog(0x16233f,90,300);document.body.prepend(ren.domElement);
const rs=()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',rs);rs();
sc.add(new T.HemisphereLight(0xbbddff,0x445566,.95));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(50,100,30);sc.add(dl);
const gr=new T.Mesh(new T.PlaneGeometry(240,240),new T.MeshLambertMaterial({color:0x2a3550}));gr.rotation.x=-Math.PI/2;sc.add(gr);
const gd=new T.GridHelper(240,48,0x4466aa,0x33446a);gd.position.y=.03;sc.add(gd);
const OB=[[0,0,7,30],[-40,25,5,22],[40,-25,5,22],[-45,-45,6,26],[45,45,6,26],[0,50,4,18],[0,-50,4,18]];
OB.forEach(([x,z,r,h])=>{const m=new T.Mesh(new T.CylinderGeometry(r,r,h,16),new T.MeshLambertMaterial({color:0x56668f}));m.position.set(x,h/2,z);sc.add(m)});

// ===== 機体データ (d:威力 a:弾数 r:リロード秒 v:弾速 h:誘導 c:撃ちっぱなし間隔 k:弾数 s:拡散) =====
const MS=[
// 1. デスティア (ディスティニーガンダム風)
{n:'デスティア',cost:3000,hp:780,b:0xe8e8f0,a:0x2a4ea8,sp:1.05,
 m:[70,75,135],ms:155,
 tf:'光の翼',tm:{sp:1.4,dm:1.1,fc:1,ml:1},
 w:[
  {n:'高エネルギーBR',d:75,a:7,r:3.5,v:105,h:.04,c:.3,k:1,s:0},
  {n:'フラッシュエッジ2',d:55,a:2,r:4.5,v:85,h:.07,c:.6,k:2,s:.18, ret:1}
 ],
 x:[
  [2.6,.1,1.4,0x1a1a24, 2.2,3.2,-.8, .4],
  [2.6,.1,1.4,0x1a1a24, -2.2,3.2,-.8, -.4],
  [.4,2.8,.6,0x88ccff, 1.0,3.4,-1.0, .2],
  [.4,2.8,.4,0x224422, -1.0,3.4,-1.0, -.2]
 ]},

// 2. アガレス (ガンダムバエル風)
{n:'アガレス',cost:2500,hp:680,b:0xf4f4f8,a:0x2255dd,sp:1.15,
 m:[60,70,80,135],ms:220, // 圧倒的な格闘突進速度
 tf:'阿頼耶識システム',tm:{sp:1.35,dm:1.1,fc:1,ml:1},
 w:[
  {n:'電磁砲',d:70,a:5,r:4,v:140,h:.03,c:.5,k:1,s:0},
  {n:'双剣投擲',d:40,a:2,r:5,v:110,h:.07,c:.4,k:2,s:.06}
 ],
 x:[
  // 悪魔の翼 (白)
  [1.8,.2,2.0,0xf4f4f8, 1.5,3.0,-.9, .5],
  [1.8,.2,2.0,0xf4f4f8, -1.5,3.0,-.9, -.5],
  // バエルソード (黄金の直剣を両手付近にマウント)
  [.15,3.0,.3,0xffcc00, 1.6,2.2,1.2, 1.3],
  [.15,3.0,.3,0xffcc00, -1.6,2.2,1.2, -1.3]
 ]},

// 3. アインズホーンFA (フルアーマーユニコーン風)
{n:'アインズホーンFA',cost:3000,hp:820,b:0xf4f4f4,a:0x22ff66,sp:.95,
 m:[65,70,120],ms:130,
 tf:'覚醒(サイコフレーム)',tm:{sp:1.2,dm:1.1,fc:.55,ml:1}, // 時限強化中は圧倒的な弾幕を張れる
 w:[
  {n:'ビーム・マグナム',d:120,a:5,r:4.5,v:150,h:.03,c:.6,k:1,s:0},
  {n:'一斉射撃',d:35,a:6,r:6,v:80,h:.08,c:.3,k:5,s:.2}, // ←末尾にカンマを追加
  {n:'極太照射ビーム',d:45,a:1,r:12,v:0,h:0,c:1.5,k:1,s:0, bz:1} // ←追加 (bz:照射フラグ)
 ],
 x:[
  // 背部の巨大プロペラントタンク
  [.6,4.0,.6,0xdddddd, 1.0,2.5,-2.0, .4],
  [.6,4.0,.6,0xdddddd, -1.0,2.5,-2.0, -.4],
  // 背部シールド
  [1.6,2.4,.2,0xf4f4f4, 1.8,3.2,-1.0, 0],
  [1.6,2.4,.2,0xf4f4f4, -1.8,3.2,-1.0, 0],
  // 頭部一本角
  [.15,1.0,.2,0xffee88, 0,4.2,.4, 0]
 ]}
];
function mk(ms){const g=new T.Group();
 const bx=(w,h,d,c,x,y,z,r=0)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.rotation.z=r;g.add(m);return m};
 g.legR=bx(.8,1.6,.9,ms.b,.6,.8,0);g.legL=bx(.8,1.6,.9,ms.b,-.6,.8,0);g.body=bx(2,1.5,1.2,ms.b,0,2.35,0);bx(1.2,.5,1.3,ms.a,0,2.5,.05);
 bx(.9,.9,.9,ms.b,0,3.5,0);bx(.6,.2,.1,ms.a,0,3.55,.46);g.armR=bx(.6,1.4,.6,ms.b,1.4,2.3,0);g.armL=bx(.6,1.4,.6,ms.b,-1.4,2.3,0);bx(.4,.5,2.4,0x333340,1.4,2.2,1.3);
 ms.x.forEach(e=>bx(...e));
 const sp=(c,o)=>{const m=new T.Mesh(new T.SphereGeometry(3.4,14,10),new T.MeshBasicMaterial({color:c,transparent:true,opacity:o}));m.position.y=2;m.visible=false;g.add(m);return m};
 g.au=sp(0xffaa33,.2);g.sh=sp(0x55ddff,.3);g.fx=sp(0xff3355,.35);g.fx.scale.set(1.3,2.8,1.3);return g}

// ===== ゲーム状態 =====
let U=[],B=[],FX=[],P=null;const G={run:0,life:[6000,6000]};
G.damage=0;G.damageTimer=0;const BG=new T.SphereGeometry(.5,8,6),BM=[0x66ccff,0xff7755].map(c=>new T.MeshBasicMaterial({color:c}));
function mkU(ms,team,isP,x,z){const u={ms,team,isP,g:mk(ms),p:V(x,0,z),v:V(0,0,0),f:V(0,0,team?1:-1),hp:ms.hp,bst:100,oh:0,am:ms.w.map(w=>w.a),rl:[0,0],cd:0,st:'n',t:0,mc:0,hit:0,hc:0,inv:2,stepCd:0,act:'idle',actT:0,dead:0,rs:0,md:0,mt:0,gd:0,gcd:0,cok:0,sm:0,tg:null,sd:V(0,0,1),in:{x:0,z:0,j:0,d:0},ai:{t:0,x:0,z:0,j:0,dd:0}};sc.add(u.g);U.push(u);return u}
function resp(u){
 // コストオーバー機能（残戦力ゲージ / 自機コスト の割合でHPを算出）
 let hpRate = 1.0;
 if (G.life[u.team] < u.ms.cost) {
  hpRate = Math.max(0.1, G.life[u.team] / u.ms.cost);
 }
 
 u.dead=0; u.g.visible=true;
 u.hp=Math.floor(u.ms.hp * hpRate); // 算出した割合を適用
 u.bst=100; u.oh=0; u.am=u.ms.w.map(w=>w.a);
 u.p.set((R()-.5)*80,0,u.team?-80:80); u.v.set(0,0,0);
 u.st='n'; u.inv=2; u.md=0; u.tg=null;
}
function tgt(u){if(!u.tg||u.tg.dead){u.tg=null;let b=1e9;for(const o of U)if(o.team!=u.team&&!o.dead){const d=o.p.distanceTo(u.p);if(d<b){b=d;u.tg=o}}}return u.tg}
function fx(p,c,s){const m=new T.Mesh(new T.SphereGeometry(1,8,6),new T.MeshBasicMaterial({color:c,transparent:true,opacity:.8}));m.position.set(p.x,p.y+2,p.z);m.scale.setScalar(s*.3);sc.add(m);FX.push({m,s,t:0})}
function fxu(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;f.m.scale.setScalar(f.s*(.3+f.t*2));f.m.material.opacity=.8-f.t*1.6;if(f.t>.5){sc.remove(f.m);FX.splice(i,1)}}}

// ===== ダメージ・撃破 =====
function die(t){t.dead=1;t.g.visible=false;t.rs=4;G.life[t.team]-=t.ms.cost;fx(t.p,0xffaa33,16);fx(t.p,0xffffff,9);
 if(G.life[t.team]<=0){G.run=0;msg((t.team?'WIN':'LOSE')+'<br><button style="pointer-events:auto;font-size:20px;padding:6px 18px" onclick=location.reload()>もう一度</button>')}}
// 戻り値 0:無効 1:命中 2:ガードされた
function hurt(t,d,k,a){
 if(t.dead||t.inv>0||t.st=='dn')return 0;
 if(t.st=='gd'){fx(t.p,0x66ddff,5);if(--t.gd<=0)t.t=0;return 2}
 t.hp-=d;fx(t.p,k=='s'?0xffee88:0xffffff,k=='s'?3:5);if(a&&a.isP){G.damage+=Math.round(d);G.damageTimer=2;$('dmg').innerHTML=`${G.damage} <small>DAMAGE</small>`;$('dmg').style.opacity='1'}
 if(t.hp<=0){die(t);return 1}
 const kx=t.p.x-a.p.x,kz=t.p.z-a.p.z,kl=Math.hypot(kx,kz)||1;t.hc=3;t.mc=0;t.act='hit';t.actT=.5;
 if(k=='k'||++t.hit>=3){t.st='dn';t.act='down';t.actT=1.4;t.t=1.4;t.hit=0;t.v.set(kx/kl*16,12,kz/kl*16)}
 else{t.st='st';t.act='stagger';t.actT=k=='m'?.5:.35;t.t=k=='m'?.5:.35;t.v.set(kx/kl*5,0,kz/kl*5)}
 return 1}

// ===== アクション =====
const ok=u=>u.st=='n'||u.st=='dash';
function shoot(u,i){const w=u.ms.w[i],t=u.tg;if(!ok(u)||u.cd>0||u.am[i]<1)return;
 const tm=u.md>0?u.ms.tm:{dm:1,fc:1};u.am[i]--;u.cd=w.c*tm.fc;u.act=i===0?'mainshoot':'subshoot';u.actT=.42;
 const o=V(u.p.x,u.p.y+2.6,u.p.z).addScaledVector(u.f,2),dist=t?t.p.distanceTo(u.p):1e9,red=!!t&&dist<=45,aim=red?V(t.p.x,t.p.y+2,t.p.z).sub(o).normalize():u.f.clone();
 for(let j=0;j<w.k;j++){const d=aim.clone().applyAxisAngle(Y,(j-(w.k-1)/2)*w.s);if(w.k>1)d.y+=(R()-.5)*.1;
  const m=new T.Mesh(BG,BM[u.team]);m.scale.setScalar(w.d>100?2:1);sc.add(m);
  B.push({m,p:o.clone(),v:d.normalize().multiplyScalar(w.v),d:w.d*tm.dm,o:u,t,h:red?w.h:0,homing:red,l:3, ret:w.ret})}}
// 照射ビーム発射処理
function shootBeam(u,i){
 const w=u.ms.w[i], t=u.tg; if(!ok(u)||u.cd>0||u.am[i]<1)return;
 const tm=u.md>0?u.ms.tm:{dm:1,fc:1};
 u.am[i]--; u.cd=w.c*tm.fc;
 u.st='ms'; u.t=1.2; u.v.set(0,0,0); // 発射中は足を止める
 u.act='mainshoot'; u.actT=1.2;
 
 const o=V(u.p.x,u.p.y+2.6,u.p.z).addScaledVector(u.f,2), dist=t?t.p.distanceTo(u.p):1e9, red=!!t&&dist<=45, aim=red?V(t.p.x,t.p.y+2,t.p.z).sub(o).normalize():V(u.f.x,0,u.f.z).normalize();
 
 const geo=new T.CylinderGeometry(2.5,2.5,300,12); // 極太の円柱
 geo.translate(0,150,0); geo.rotateX(Math.PI/2);
 const mat=new T.MeshBasicMaterial({color:0xff66cc,transparent:true,opacity:0.8,blending:T.AdditiveBlending,depthWrite:false});
 const m=new T.Mesh(geo,mat);
 m.position.copy(o); m.lookAt(o.clone().add(aim)); sc.add(m);
 
 B.push({m,p:o,v:aim,d:w.d*tm.dm,o:u,t,bz:1,l:1.2,hd:0});
}
function melee(u,sub){
 if(u.st=='ms'&&u.cok&&u.mc<u.ms.m.length&&!sub){u.st='md';u.t=1;return}
 if(!ok(u)||!u.tg||u.oh||(u.md>0&&!u.ms.tm.ml))return;
 u.st='md';u.t=1.1;u.mc=sub?u.ms.m.length-1:0;u.sm=sub;u.cok=0;u.act=sub?'submelee':'melee';u.actT=.8;
 u.mRed = (u.tg.p.distanceTo(u.p) <= 45);
}

function strike(u,t){
 const i=u.mc, r=hurt(t,u.ms.m[i],'m',u), fin=i===u.ms.m.length-1;
 if(!r){u.st='n';u.mc=0;return}
 u.mc=i+1;u.cok=r==1&&!fin;u.v.set(0,0,0);
 if(r==2){u.st='st';u.t=.7;u.mc=0;u.v.copy(u.f).multiplyScalar(-12)}else{u.st='ms';u.t=fin?.7:.45}
}
function dash(u){if(u.st=='n'&&!u.oh&&u.bst>15){u.st='dash';u.t=.3}}
function step(u,dx,dz){if(!ok(u)||u.oh||u.bst<12||u.stepCd>0)return;u.bst-=14;u.st='step';u.t=.18;u.stepCd=.62;u.sd=V(dx,0,dz).normalize();u.act='step';u.actT=.3}
function guard(u){if(!ok(u)||u.gcd>0)return;u.st='gd';u.t=1.3;u.gd=3;u.gcd=2.5;u.v.multiplyScalar(.2)}
function tf(u){if(u.md>0)u.md=0;else if(u.mt<=0&&ok(u)){u.md=8;u.mt=10;u.act='transform';u.actT=.8}}
const dirOf=u=>{const f=u.f,i=u.in;return V(f.x*i.z-f.z*i.x,0,f.z*i.z+f.x*i.x)};

// ===== 1機の更新 =====
function upd(u,dt){
 if(u.dead){if((u.rs-=dt)<=0&&G.life[u.team]>0)resp(u);return}
 const t=tgt(u);if(t)u.f.set(t.p.x-u.p.x,0,t.p.z-u.p.z).normalize();
 u.cd-=dt;u.inv-=dt;u.t-=dt;u.gcd-=dt;u.mt-=dt;u.md-=dt;u.stepCd=Math.max(0,u.stepCd-dt);u.actT=Math.max(0,u.actT-dt);if((u.hc-=dt)<=0)u.hit=0;
 u.ms.w.forEach((w,i)=>{if(u.am[i]<w.a){if((u.rl[i]+=dt)>=w.r){u.rl[i]=0;u.am[i]++}}else u.rl[i]=0});
 const c=u.in,tm=u.md>0?u.ms.tm:null,sp=u.ms.sp*(tm?tm.sp:1),gnd=u.p.y<=.01;let bo=0;
 if(ok(u)){
  const d=dirOf(u);if(d.lengthSq()>1)d.normalize();
  if(u.st=='dash'){
   if(!d.lengthSq())d.copy(u.f);else d.normalize();
   u.v.x=d.x*30*sp;u.v.z=d.z*30*sp;u.v.y*=.85;u.bst-=(tm?18:24)*dt;bo=1;
   if(u.t<=0&&(!c.d||u.bst<=0))u.st='n';
  }else{
   const k=Math.min(1,(gnd?10:2.5)*dt),s=(gnd?9:11)*sp;
   u.v.x+=(d.x*s-u.v.x)*k;u.v.z+=(d.z*s-u.v.z)*k;
   if(c.j&&!u.oh&&u.bst>0){u.v.y=Math.min(u.v.y+45*dt,14);u.bst-=16*dt;bo=1}else u.v.y=Math.max(u.v.y-28*dt,-16);
  }
 }else if(u.st=='step'){u.v.x=u.sd.x*42*sp;u.v.z=u.sd.z*42*sp;u.v.y*=.8;if(u.t<=0){u.st='sr';u.t=.22}}
 else if(u.st=='sr'){u.v.x*=Math.pow(.015,dt);u.v.z*=Math.pow(.015,dt);u.v.y=Math.max(u.v.y-28*dt,-16);if(u.t<=0)u.st='n'}
 else if(u.st=='md'){
  if(!t||u.t<=0||u.bst<=0){u.st='n';u.mc=0}
  else{
   const dx=t.p.x-u.p.x,dy=t.p.y-u.p.y,dz=t.p.z-u.p.z,L=Math.hypot(dx,dy,dz)||1;
   if(L<5)strike(u,t);
   else{
    // 【修正】接近速度をマイルドにするため 0.4 を掛ける（通常のブーストダッシュの2〜3倍程度の適正速度）
    const speed = u.ms.ms * sp * 0.2;
    
    if (u.mRed) {
     // レッドロック時：敵に向かってホーミング突進
     u.v.set(dx/L*speed, dy/L*speed, dz/L*speed);
    } else {
     // グリーンロック時：ホーミングせず、向いている方向(u.f)へ水平に直進
     u.v.set(u.f.x*speed, 0, u.f.z*speed);
    }
    u.bst-=14*dt;
   }
  }
 }
 else if(u.t<=0 && (u.st=='gd'||u.st=='st'||u.st=='dn'||u.st=='ms')){ u.st='n'; } // 追加: タイマー切れで通常状態へ戻す
 if(u.bst<=0){u.bst=0;u.oh=1;if(u.st=='dash'||u.st=='md')u.st='n'}
 if(!bo&&u.st!='step'&&u.st!='md'){u.bst=Math.min(100,u.bst+(gnd?(u.oh?32:45):(u.oh?16:12))*dt);if(u.bst>=100)u.oh=0}
 u.p.addScaledVector(u.v,dt);
 if(u.p.y<0){u.p.y=0;if(u.v.y<0)u.v.y=0}
 if(u.p.y>45){u.p.y=45;u.v.y=Math.min(u.v.y,0)}
 u.p.x=C(-102,102,u.p.x);u.p.z=C(-102,102,u.p.z);
 for(const [x,z,r,h] of OB)if(u.p.y<h){const dx=u.p.x-x,dz=u.p.z-z,d=Math.hypot(dx,dz)||1,m=r+1.5;if(d<m){u.p.x=x+dx/d*m;u.p.z=z+dz/d*m}}
 u.g.position.copy(u.p);u.g.rotation.y=Math.atan2(u.f.x,u.f.z);u.g.au.visible=u.md>0;u.g.sh.visible=u.st=='gd';u.g.fx.visible=u.actT>0&&(u.act==='mainshoot'||u.act==='subshoot'||u.act==='melee'||u.act==='submelee'||u.act==='transform');
 const pulse=Math.sin((.8-u.actT)*18),g=u.g;g.armR.rotation.x=0;g.armL.rotation.x=0;g.armR.rotation.z=0;g.armL.rotation.z=0;g.body.rotation.z=0;g.legR.rotation.x=0;g.legL.rotation.x=0;g.rotation.z=0;
 if(u.actT>0){if(u.act==='mainshoot'){g.armR.rotation.x=-.9;g.armR.rotation.z=-.25;g.fx.position.set(1.7,2.7,2.1)}else if(u.act==='subshoot'){g.armL.rotation.x=-.8;g.armL.rotation.z=.35;g.fx.position.set(-1.7,2.7,2.1)}else if(u.act==='melee'){g.armR.rotation.x=-1.2+pulse*.35;g.armR.rotation.z=-.8;g.body.rotation.y=pulse*.12;g.legL.rotation.x=-.45}else if(u.act==='submelee'){g.armL.rotation.x=-1.3+pulse*.35;g.armL.rotation.z=.8;g.body.rotation.y=-pulse*.12;g.legR.rotation.x=-.5}else if(u.act==='transform'){g.body.rotation.x=.25+pulse*.1;g.armR.rotation.z=-.65;g.armL.rotation.z=.65;g.legR.rotation.x=.5;g.legL.rotation.x=-.5}else if(u.act==='hit'||u.act==='stagger'){g.body.rotation.z=.25;g.armR.rotation.z=-.7;g.armL.rotation.z=.7}else if(u.act==='down'){g.rotation.z=.8;g.body.rotation.z=.5}else if(u.act==='step'){g.body.rotation.z=u.sd.x*.35;g.legR.rotation.x=.6;g.legL.rotation.x=-.6}}
 if(u.st==='dn'){g.rotation.z=.8;g.body.rotation.z=.5;}
}

// ===== CPU AI (僚機・敵共通) =====
function ai(u,dt){
 const a=u.ai,c=u.in,t=tgt(u);if(!t){c.x=c.z=c.j=0;return}
 const d=u.p.distanceTo(t.p);
 if((a.t-=dt)<=0){a.t=.5+R()*.9;a.x=R()<.5?-1:1;a.z=d>45?1:d<16?-1:(R()<.5?1:0);a.j=R()<.4;a.dd=R()<.35}
 c.x=a.x;c.z=a.z;c.j=a.j&&u.p.y<25?1:0;c.d=0;
 if(a.dd&&u.st=='n'&&!u.oh&&u.bst>35){a.dd=0;dash(u);u.t=.7}
 if(u.cd<=0&&R()<.02&&d<95)shoot(u,R()<.3?1:0);
 if(d<24&&R()<.012&&u.bst>35)melee(u,R()<.25);
 if(u.st=='ms'&&u.cok&&R()<.08)melee(u,0);
 for(const b of B)if(b.t==u&&b.p.distanceTo(u.p)<35){if(R()<.03){const s=R()<.5?1:-1;step(u,-u.f.z*s,u.f.x*s)}else if(R()<.004)guard(u)}
}

// ===== 弾 =====
function bul(dt){for(let i=B.length-1;i>=0;i--){const b=B[i],t=b.t;let dead=(b.l-=dt)<=0;
 if(b.bz){
  // 照射ビームの処理
  if(!dead){
   b.m.scale.set(b.l/1.2, b.l/1.2, 1); // だんだん細く消える演出
   if((b.hd-=dt)<=0){
    let hit=0;
    for(const o of U)if(o.team!=b.o.team&&!o.dead){
     const to=V(o.p.x,o.p.y+2,o.p.z).sub(b.p), dot=to.dot(b.v);
     if(dot>0&&dot<300&&to.sub(b.v.clone().multiplyScalar(dot)).length()<4){
      if(hurt(o,b.d,'s',b.o)) hit=1;
     }
    }
    if(hit) b.hd=0.15; // 0.15秒ごとに多段ヒット
   }
  }
 }else{
  // 通常の弾・ブーメランの処理
  if(!dead){
   if(b.ret && b.l < 1.5){
    const to=V(b.o.p.x,b.o.p.y+2,b.o.p.z).sub(b.p),s=b.v.length();
    b.v.lerp(to.setLength(s),Math.min(1, 4 * dt)).setLength(s);
   } else if(b.homing&&b.h&&t&&!t.dead&&t.st!='step'){
    const to=V(t.p.x,t.p.y+2,t.p.z).sub(b.p),s=b.v.length();
    if(to.dot(b.v)>0)b.v.lerp(to.setLength(s),Math.min(1,b.h*60*dt)).setLength(s);
   }
  }
  b.p.addScaledVector(b.v,dt);b.m.position.copy(b.p);
  if(!dead){if(b.p.y<0||OB.some(([x,z,r,h])=>b.p.y<h&&Math.hypot(b.p.x-x,b.p.z-z)<r))dead=1;
   else for(const o of U)if(o.team!=b.o.team&&!o.dead&&b.p.distanceTo(V(o.p.x,o.p.y+2,o.p.z))<2.8&&hurt(o,b.d,'s',b.o)){dead=1;break}}
 }
 if(dead){sc.remove(b.m);B.splice(i,1)}}}
// ===== 入力 =====
const K={},kd={},cons={},lt0={};
const act={J:()=>{if(K.KeyS&&P.ms.w[2])shootBeam(P,2);else shoot(P,0)},K:()=>melee(P,0),JK:()=>melee(P,1),JL:()=>shoot(P,1),KL:()=>tf(P)};
function res(c,t){if(cons[c]==t||!G.run)return;
 const o=['KeyJ','KeyK','KeyL'].find(k=>k!=c&&Math.abs(kd[k]-t)<80&&cons[k]!=kd[k]);
 if(o){cons[c]=t;cons[o]=kd[o];act[[c,o].map(x=>x[3]).sort().join('')]()}
 else if(c!='KeyL'){cons[c]=t;act[c[3]]()}}
function swt(){const es=U.filter(o=>o.team!=P.team&&!o.dead);if(es.length>1)P.tg=es[(es.indexOf(P.tg)+1)%es.length]}
addEventListener('keydown',e=>{const c=e.code;if(c=='Tab')e.preventDefault();if(e.repeat||!G.run||P.dead)return;
 const n=performance.now();K[c]=1;if(c=='Tab'){swt();return}
 kd[c]=n;if('KeyJ,KeyK,KeyL'.includes(c))setTimeout(()=>res(c,n),70);
 const prev=lt0[c]||-1e9;lt0[c]=n;
 if(c=='KeyL'&&n-prev<250)dash(P);
 const dm={KeyW:[0,1],KeyS:[0,-1],KeyA:[-1,0],KeyD:[1,0]}[c];
 if(dm){if(n-prev<220){step(P,P.f.x*dm[1]-P.f.z*dm[0],P.f.z*dm[1]+P.f.x*dm[0]);lt0[c]=-1e9}
  if(c=='KeyW'&&n-(lt0.KeyS||-1e9)<300)guard(P)}});
addEventListener('keyup',e=>K[e.code]=0);

// ===== HUD・カメラ =====
const bar=(v,m,c,w=150)=>`<span class=b style="width:${w}px"><i style="width:${C(0,100,v/m*100)}%;background:${c}"></i></span>`;
function hud(){const al=U.find(o=>o.team==0&&!o.isP),m=P.ms;
 $('tl').innerHTML=`味方 ${Math.max(0,G.life[0])} ${bar(G.life[0],6000,'#4af')}<br>僚機 ${al.ms.n} ${bar(al.dead?0:al.hp,al.ms.hp,'#8f8',90)}`;
 $('tr').innerHTML=`敵 ${Math.max(0,G.life[1])} ${bar(G.life[1],6000,'#f55')}`;
 $('bl').innerHTML=`<b>${m.n}</b>${P.md>0?'　['+m.tf+']':''}<br>HP ${Math.ceil(Math.max(0,P.hp))} ${bar(P.hp,m.hp,'#6f6',200)}<br>BOOST ${bar(P.bst,100,P.oh?'#f44':'#fc3',200)}${P.oh?' OVERHEAT':''}<br>J ${m.w[0].n} ×${P.am[0]}　JL ${m.w[1].n} ×${P.am[1]}${m.w[2]?'　S+J '+m.w[2].n+' ×'+P.am[2]:''}<br>KL ${P.mt>0&&P.md<=0?'変形 待機'+Math.ceil(P.mt)+'秒':m.tf}`;
 const t=P.tg,lk=$('lk');
 if(t&&!t.dead&&!P.dead){const q=V(t.p.x,t.p.y+2,t.p.z).project(cam);
  if(q.z<1){lk.style.display='block';const lockDist=t.p.distanceTo(P.p),isRed=lockDist<=45;lk.style.borderColor=isRed?'#ff3434':'#35eaff';lk.style.boxShadow=isRed?'0 0 12px #f33':'0 0 12px #20dfff';lk.style.left=(q.x*.5+.5)*innerWidth+'px';lk.style.top=(-q.y*.5+.5)*innerHeight+'px';lk.children[0].textContent=`${isRed?'RED LOCK':'GREEN LOCK'}　${t.ms.n} HP${Math.round(t.hp/t.ms.hp*100)}% ${Math.round(lockDist)}m`}else lk.style.display='none'}
 else lk.style.display='none'}
function camU(dt){const f=P.f,pos=V(P.p.x-f.x*16,Math.max(2,P.p.y+8),P.p.z-f.z*16);cam.position.lerp(pos,Math.min(1,6*dt));
 const la=V(P.p.x,P.p.y+3,P.p.z),t=P.tg;if(t&&!t.dead)la.lerp(V(t.p.x,t.p.y+2,t.p.z),.25);cam.lookAt(la)}

// ===== 開始・メインループ =====
MS.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${m.n}</b>　コスト${m.cost}　HP${m.hp}<br><small>${m.w[0].n} / ${m.w[1].n} / 変形:${m.tf}</small>`;b.onclick=()=>start(i);$('menu').append(b)});
function start(i){$('menu').style.display='none';const o=MS.filter((_,j)=>j!=i),pk=()=>MS[Math.floor(R()*3)];
 P=mkU(MS[i],0,1,-15,70);mkU(o[Math.floor(R()*2)],0,0,15,70);mkU(pk(),1,0,-15,-70);mkU(pk(),1,0,15,-70);
 cam.position.set(P.p.x,10,P.p.z+16);msg('READY');
 setTimeout(()=>{msg('GO!');G.run=1;setTimeout(()=>{if(G.run)msg('')},800)},1800)}
cam.position.set(0,40,130);cam.lookAt(0,0,0);
let lt=0;(function L(n){requestAnimationFrame(L);const dt=Math.min(.05,(n-lt)/1000||0);lt=n;
 if(P){if(G.run){const c=P.in;c.x=(K.KeyD?1:0)-(K.KeyA?1:0);c.z=(K.KeyW?1:0)-(K.KeyS?1:0);c.j=c.d=K.KeyL||0;
   U.forEach(u=>{if(u!=P&&!u.dead)ai(u,dt);upd(u,dt)});bul(dt)}
  if(G.damageTimer>0){G.damageTimer-=dt;if(G.damageTimer<=0){G.damage=0;$('dmg').style.opacity='0'}}fxu(dt);camU(dt);hud()}
 ren.render(sc,cam)})(0);
